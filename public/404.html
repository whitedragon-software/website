<script>
/* Same theme logic as the homepage: saved choice first, then system preference. */
(function(){
  var saved = null;
  try { saved = localStorage.getItem("wd-theme"); } catch (e) {}
  var theme = saved || ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --ink:#2C2C2B; --ink2:#7D7A75; --bg:#FFFFFF; --soft:#F9F8F7; --soft2:#F0EFED;
    --line:#E6E5E3; --accent:#2783DE; --accent-tint:#E8F1FC; --panel:#F6F9FD; --inverse:#2C2C2B; --on-inverse:#FFFFFF;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  html[data-theme="dark"]{
    --ink:#F1F1EF; --ink2:#8B8B91; --bg:#0A0A0C; --soft:#151517; --soft2:#1B1B1E;
    --line:#29292D; --accent:#6C89FF; --accent-tint:#1B2040; --panel:#111319; --inverse:#F1F1EF; --on-inverse:#0A0A0C;
  }
  html{-webkit-text-size-adjust:100%;height:100%}
  body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-wrap:break-word;transition:background .25s ease,color .25s ease}
  h1,h2,p{margin:0}
  a{color:inherit}

  /* Background: dot grid + a small node mesh, same language as the homepage. */
  .bg-field{position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;overflow:hidden;pointer-events:none}
  .bg-grid{position:absolute;top:0;right:0;bottom:0;left:0;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:40px 40px;opacity:.35}
  .bg-net{position:absolute;top:0;right:0;bottom:0;left:0;opacity:.34}
  .bg-net svg{width:100%;height:100%}
  .bg-net .nl{stroke:var(--line);stroke-width:1.4;fill:none}
  .bg-net .nn{fill:var(--bg);stroke:var(--ink2);stroke-width:1.8;animation:node-breathe 4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  .bg-net .nn:nth-of-type(3n){animation-duration:5.4s}
  .bg-net .nn:nth-of-type(3n+1){animation-duration:3.2s}
  .bg-net .nn.live{fill:var(--accent);stroke:var(--accent);animation:node-live 3.6s ease-in-out infinite}
  @keyframes node-breathe{
    0%,100%{opacity:.2;transform:scale(.7);stroke-width:1.2}
    50%{opacity:1;transform:scale(1.6);stroke-width:2.2}
  }
  @keyframes node-live{
    0%,100%{opacity:.35;transform:scale(.75)}
    50%{opacity:1;transform:scale(1.7)}
  }
  html[data-theme="dark"] .bg-net{opacity:.42}
  @media (prefers-reduced-motion:reduce){.bg-net .nn,.bg-net .nn.live{animation:none;opacity:.6}}

  /* Header */
  .site{background:var(--bg);border-bottom:1px solid var(--line)}
  .wrap{max-width:1060px;margin:0 auto;padding:0 24px}
  .site .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
  .brand{display:inline-flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;text-decoration:none}
  .brand svg{width:24px;height:24px}
  .dim{color:var(--ink2)}
  .brand-mark{width:32px;height:32px;display:block;object-fit:contain}
  html[data-theme="dark"] .brand-mark{filter:invert(1)}
  .theme-toggle{appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
  .theme-toggle:hover{background:var(--soft)}
  .theme-toggle svg{width:20px;height:20px}

  /* Content */
  main{flex:1;display:flex;align-items:center}
  .content{padding-top:72px;padding-bottom:96px}
  .badge{display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;background:var(--accent-tint);color:var(--accent);font:600 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
  .code{margin-top:20px;font:600 clamp(72px,16vw,148px)/1 var(--mono);letter-spacing:-.05em}
  .code span{color:var(--accent)}
  h1{margin-top:12px;font-size:clamp(26px,4vw,36px);line-height:1.15;letter-spacing:-.02em;font-weight:600}
  .lede{margin-top:14px;max-width:520px;color:var(--ink2);font-size:17px}
  .term{margin-top:32px;max-width:480px;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
  .term-bar{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .term-bar i{width:9px;height:9px;border-radius:50%;background:var(--line)}
  .term-body{padding:14px 16px;font:13px/1.7 var(--mono);color:var(--ink2);overflow-x:auto}
  .term-body b{color:var(--ink);font-weight:500}
  .term-body .err{color:var(--accent)}
  .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
  .btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;font-size:15px;text-decoration:none;border:1px solid var(--line);transition:background .15s ease,opacity .15s ease}
  .btn--solid{background:var(--inverse);border-color:var(--inverse);color:var(--on-inverse)}
  .btn--solid:hover{opacity:.88}
  .btn--ghost:hover{background:var(--soft)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Footer */
  .foot{border-top:1px solid var(--line);background:var(--bg)}
  .foot .wrap{padding-top:20px;padding-bottom:20px;color:var(--ink2);font-size:13px}
  @media (max-width:520px){.content{padding-top:48px;padding-bottom:64px}}
</style>
</head>

    <p class="lede">The page you're looking for doesn't exist, was moved, or the address has a typo. Nothing is broken on your end.</p>

    <div class="term" aria-hidden="true">
      <div class="term-bar"><i></i><i></i><i></i></div>
      <div class="term-body">
        <div><b>$</b> GET <span id="reqPath">/this/page</span></div>
        <div class="err">404 Not Found</div>
      </div>
    </div>

    <div class="actions">
      <a class="btn btn--solid" href="/">Back to homepage</a>
      <a class="btn btn--ghost" href="/#license">View licenses</a>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="wrap">&copy; <span id="year">2026</span> WhiteDragon Software</div>
</footer>

<script>
(function(){
  var root = document.documentElement;
  var btn = document.getElementById("themeToggle");
  var icon = document.getElementById("themeIcon");
  var SUN = '<circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  var MOON = '<path stroke-linejoin="round" d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>';
  function paint(){
    var dark = root.getAttribute("data-theme") === "dark";
    icon.innerHTML = dark ? SUN : MOON;
    btn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
  }
  btn.addEventListener("click", function(){
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("wd-theme", next); } catch (e) {}
    paint();
  });
  paint();

  var p = document.getElementById("reqPath");
  if (p) { p.textContent = (location.pathname || "/").slice(0, 60); }
  var y = document.getElementById("year");
  if (y) { y.textContent = new Date().getFullYear(); }
})();

/* The node network is regenerated with randomized node positions,
   connections, animation delays and "live" nodes on every page load,
   so the background never looks identical twice. */
(function(){
  var svg = document.querySelector(".bg-net svg");
  if (!svg) return;
  var W = 1600;
  var rows = [
    { y: 105, n: 9, jitterY: 50 },
    { y: 515, n: 8, jitterY: 50 },
    { y: 735, n: 7, jitterY: 35 }
  ];
  var nodeRows = [];
  var rowPaths = [];
  for (var r = 0; r < rows.length; r++) {
    var row = rows[r], pts = [];
    for (var i = 0; i < row.n; i++) {
      var x = Math.round((i + 0.5) * (W / row.n) + (Math.random() * 40 - 20));
      var y2 = Math.round(row.y + (Math.random() * row.jitterY * 2 - row.jitterY));
      pts.push({ x: x, y: y2 });
    }
    nodeRows.push(pts);
    rowPaths.push("M" + pts.map(function(p){ return p.x + " " + p.y; }).join(" L "));
  }
  var linkPaths = [];
  for (var r2 = 0; r2 < nodeRows.length - 1; r2++) {
    var a = nodeRows[r2], b = nodeRows[r2 + 1];
    for (var i2 = 1; i2 < a.length; i2 += 2) {
      var best = 0, bestDist = Infinity;
      for (var j = 0; j < b.length; j++) {
        var dist = Math.abs(b[j].x - a[i2].x);
        if (dist < bestDist) { bestDist = dist; best = j; }
      }
      linkPaths.push("M" + a[i2].x + " " + a[i2].y + " L" + b[best].x + " " + b[best].y);
    }
  }
  var gPaths = rowPaths.concat(linkPaths).map(function(d){ return '<path d="' + d + '"/>'; }).join("");
  var circles = [];
  for (var r3 = 0; r3 < nodeRows.length; r3++) {
    var pts3 = nodeRows[r3];
    var liveIdx = Math.floor(Math.random() * pts3.length);
    for (var k2 = 0; k2 < pts3.length; k2++) {
      var p = pts3[k2], live = (k2 === liveIdx);
      var delay = (Math.random() * 6.6).toFixed(2) + "s";
      circles.push('<circle class="nn' + (live ? ' live' : '') + '" cx="' + p.x + '" cy="' + p.y + '" r="' + (live ? "4.6" : "4") + '" style="animation-delay:' + delay + '"/>');
    }
  }
  svg.innerHTML = '<g class="nl">' + gPaths + '</g>' + circles.join("");
})();
</script>
</body>
</html>
